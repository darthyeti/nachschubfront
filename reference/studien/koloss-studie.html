<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nachschubfront: Koloss-Studie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@500;700&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1410;--plate:#3e372d;--gold:#e8c872;--text:#eadfc4;--muted:#b5a385;--ink:#000;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1410;--text:#eadfc4;}}
:root[data-theme="dark"]{--bg:#1c1410;--text:#eadfc4;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none;max-width:calc(100% - 32px)}
.hud h1{font-family:'Pirata One',Georgia,serif;font-weight:400;font-size:clamp(26px,3.6vw,40px);margin:0;line-height:1;text-shadow:3px 3px 0 #000}
.hud p{margin:4px 0 0;font-size:15px;color:var(--muted)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;background:#241a14;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px;border-radius:8px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 24px)}
button{font-family:inherit;font-weight:700;font-size:16px;color:var(--text);background:var(--plate);border:2px solid var(--ink);border-radius:5px;padding:7px 12px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(232,200,114,.35);min-height:40px}
button.on{background:var(--gold);color:#1a1410}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" aria-label="Isometrische Szene: ein Koloss fährt geradlinig vom Rand der Riss-Seite auf ein markiertes Ziel zu und walzt Trümmer nieder"></canvas>
<div class="hud"><h1>Koloss</h1><p>Geradlinige Fahrt vom Kartenrand zum Ziel, Trümmer werden zermalmt, ein Bollwerk stoppt ihn. Luftschlag: höchstens 30 % seiner Lebenspunkte pro Einsatz. Fahrtrichtung über die Pfeile wählbar</p></div>
<div class="bar">
  <span style="color:#b5a385;font-size:15px;margin:0 2px">Richtung</span>
  <button data-dir="0" class="on" aria-label="nach rechts unten">↘</button>
  <button data-dir="1" aria-label="nach links unten">↙</button>
  <button data-dir="2" aria-label="nach links oben">↖</button>
  <button data-dir="3" aria-label="nach rechts oben">↗</button>
  <button id="restart">Neu starten</button>
  <button id="bw">Bollwerk am Ziel</button>
  <button id="air">Luftschlag</button>
  <button id="pause">Pause</button>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const INK='#1a1410',R=Math.random;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MW=14,MH=9,P=(x,y,z=0)=>[(x-y)*32,(x+y)*16-z];
const C={top:'#b3a58d',left:'#8a7d6a',right:'#5e5445',dark:'#1f1a15',
  hull:'#5c4f45',hullL:'#7a6a5c',hullD:'#3a312b',rust:'#8a4a2a',rustD:'#5e2f1a',track:'#2a2420',wheel:'#6b625a',bone:'#d8c9a8',red:'#ff3a1a'};
let W,H,DPR,S,OX,OY,T=0,paused=false,shake=0,bollwerk=false;

function poly(p,fill,lw=2.4,stroke=INK){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(lw){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke();}}
function ell(x,y,rx,ry,fill,lw=0,stroke=INK,rot=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(lw){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke();}}
function line(x0,y0,x1,y1,w,col){ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineWidth=w;ctx.strokeStyle=col;ctx.lineCap='round';ctx.stroke();}
function tube(a,b,w,col,hl){line(a[0],a[1],b[0],b[1],w+3.4,INK);line(a[0],a[1],b[0],b[1],w,col);if(hl)line(a[0],a[1]-w*.25,b[0],b[1]-w*.25,Math.max(1,w*.28),hl);}
function star(x,y,ro,ri,n,fill,rot=0){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?ri:ro,a=rot+i*Math.PI/n;const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r*.8;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=INK;ctx.stroke();}

/* ---------- Welt ---------- */
const SPAWN=-2.2, SWATH=5;let TARGET=5;
const rift=[0.5,1.5], bastion=[12.5,4.5];
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
const LANES=[{o:[0,4.5],len:MW},{o:[6.5,0],len:MH},{o:[MW,2.5],len:MW},{o:[6.5,MH],len:MH}];
let dir=0;
const laneAt=s=>{const L=LANES[dir],d=DIRS[dir];return [L.o[0]+d[0]*s,L.o[1]+d[1]*s];};
const laneCell=i=>laneAt(i+.5).map(Math.floor);
let rubble,crushed,decals,parts,fx,k,phase,phaseT,msg,msgT,ship=null,airCd=0;
function rubbleCell(x,y){let sd=x*73+y*151;const rnd=()=>{sd=(sd*16807)%2147483647;return (sd-1)/2147483646;};
  const pieces=[];const n=2+(rnd()<.5?1:0);for(let i=0;i<n;i++){const w=.28+rnd()*.3,d=.28+rnd()*.3,h=6+rnd()*14;pieces.push({px:x+.08+rnd()*(.84-w),py:y+.08+rnd()*(.84-d),w,d,h,brick:rnd()<.4});}
  pieces.sort((a,b)=>(a.px+a.py)-(b.px+b.py));return {x,y,pieces};}
function reset(){
  rubble=new Map();for(const x of [5,7,9])for(let y=1;y<=7;y++)if(!(x===7&&y===7)&&!(x===5&&y===1))rubble.set(x+','+y,rubbleCell(x,y));
  for(const [x,y] of [[6,2],[8,6],[6,6],[8,2],[10,3],[3,6],[3,2],[6,3],[6,5],[6,7],[6,1],[8,4]])rubble.set(x+','+y,rubbleCell(x,y));
  // Ziel = erstes Hindernis auf der Fahrlinie; ab dort wird eine Schneise von SWATH Feldern gewalzt
  TARGET=5;for(let i=0;i<LANES[dir].len;i++){const [cx,cy]=laneCell(i);if(rubble.has(cx+','+cy)){TARGET=i;break;}}
  if(bollwerk){const [bx,by]=laneCell(TARGET);rubble.delete(bx+','+by);}
  crushed=0;decals=[];parts=[];fx=[];
  k={s:SPAWN,v:0,alpha:0,recoil:0,aa:0,stopped:false,shot:1.2,hp:1000,max:1000,flash:0,dead:false};ship=null;airCd=0;
  phase='warn2';phaseT=0;msg='Ein Koloss nähert sich. Ankunft in 2 Wellen';msgT=0;
}
reset();

/* ---------- 3D-Baukasten: drehbare Quader und Prismen ---------- */
function hexRGB(h){const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
const shadeCache=new Map();
function shade(hex,b){const key=hex+b.toFixed(2);let v=shadeCache.get(key);if(!v){const [r,g2,bl]=hexRGB(hex);v=`rgb(${Math.round(r*b)},${Math.round(g2*b)},${Math.round(bl*b)})`;shadeCache.set(key,v);}return v;}
function kframe3(wx,wy,alt,d,sc){const f=DIRS[d],sd=[-f[1],f[0]];
  const wpos=(lx,ly)=>[wx+(lx*f[0]+ly*sd[0])*sc,wy+(lx*f[1]+ly*sd[1])*sc];
  return {f,sd,sc,alt,
    W:(lx,ly,z)=>{const [x,y]=wpos(lx,ly);return P(x,y,alt+z*sc);},
    Wg:(lx,ly)=>{const [x,y]=wpos(lx,ly);return P(x,y,0);},
    xy:(lx,ly)=>{const [x,y]=wpos(lx,ly);return x+y;},
    wn:(nx,ny,nz)=>[nx*f[0]+ny*sd[0],nx*f[1]+ny*sd[1],nz],
    fwdScreen:()=>{const a=P(0,0),b=P(f[0],f[1]);const l=Math.hypot(b[0]-a[0],b[1]-a[1]);return [(b[0]-a[0])/l,(b[1]-a[1])/l];}};}
function visible(n){return n[0]+n[1]+n[2]*1.2>0.01;}
function bright(n){return Math.max(.4,Math.min(1,.62+.38*n[2]+.14*n[1]-.1*n[0]));}
// Prisma: Querschnitt in (lx,z), extrudiert entlang ly von a bis b
function prism(F,sec,a,b,col,lw=2.4,layer=0,band=false){
  let cx=0,cz=0;for(const [x,z] of sec){cx+=x;cz+=z;}cx/=sec.length;cz/=sec.length;
  return {d:F.xy(cx,(a+b)/2)+layer*20+cz*.0005,draw(){
    for(const [ly,ny] of [[b,1],[a,-1]]){const n=F.wn(0,ny,0);if(visible(n))poly(sec.map(([x,z])=>F.W(x,ly,z)),shade(col,bright(n)),lw);}
    for(let i=0;i<sec.length;i++){const p=sec[i],q=sec[(i+1)%sec.length];let nx=q[1]-p[1],nz=-(q[0]-p[0]);const mx=(p[0]+q[0])/2-cx,mz=(p[1]+q[1])/2-cz;if(nx*mx+nz*mz<0){nx=-nx;nz=-nz;}
      const l=Math.hypot(nx,nz);if(l<1e-6)continue;if(band&&Math.abs(nz/l)>.5)continue;const n=F.wn(nx/l,0,nz/l*(1/F.sc));const nn=Math.hypot(n[0],n[1],n[2]);const n2=[n[0]/nn,n[1]/nn,n[2]/nn];
      if(visible(n2))poly([F.W(p[0],a,p[1]),F.W(q[0],a,q[1]),F.W(q[0],b,q[1]),F.W(p[0],b,p[1])],shade(col,bright(n2)),lw);}}};}
const boxP=(F,x0,x1,y0,y1,z0,z1,col,lw,layer,band)=>prism(F,[[x0,z0],[x1,z0],[x1,z1],[x0,z1]],y0,y1,col,lw,layer,band);
// Rundes Triebwerk: Zylinder entlang lx, vorne Radius r1, hinten r0 (Radius in Feldern, z-Radius in px)
function nacelle(F,lx0,lx1,ly,zc,r0,r1,col,layer=0){const n=12,RZ=36;
  const ring=(lx,r)=>{const a=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2;a.push([lx,ly+Math.cos(t)*r,zc+Math.sin(t)*r*RZ,Math.cos(t),Math.sin(t)]);}return a;};
  const A=ring(lx0,r0),B=ring(lx1,r1);
  return {d:F.xy((lx0+lx1)/2,ly)+layer*20+zc*.0005,draw(){
    for(let i=0;i<n;i++){const j=(i+1)%n,cy=(A[i][3]+A[j][3])/2,cz=(A[i][4]+A[j][4])/2;const nw=F.wn(0,cy,cz);if(!visible(nw))continue;
      poly([F.W(A[i][0],A[i][1],A[i][2]),F.W(A[j][0],A[j][1],A[j][2]),F.W(B[j][0],B[j][1],B[j][2]),F.W(B[i][0],B[i][1],B[i][2])],shade(col,bright(nw)),1.2);}
    // Umriss nachziehen
    const back=F.wn(-1,0,0),front=F.wn(1,0,0);
    if(visible(back)){poly(A.map(p=>F.W(p[0],p[1],p[2])),shade(col,bright(back)),2.2);
      const c=A.map(p=>F.W(p[0]-.02,ly+(p[1]-ly)*.62,zc+(p[2]-zc)*.62));poly(c,'#241e1a',1.6);
      const g=A.map(p=>F.W(p[0]-.02,ly+(p[1]-ly)*.3,zc+(p[2]-zc)*.3));poly(g,'#ff8a2a',0);}
    if(visible(front))poly(B.map(p=>F.W(p[0],p[1],p[2])),shade(col,bright(front)),2.2);
    // Rippen
    for(const t of [.3,.62]){const lx=lx0+(lx1-lx0)*t,r=r0+(r1-r0)*t;ctx.beginPath();let first=true;
      for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,cy=Math.cos(a),cz=Math.sin(a);if(!visible(F.wn(0,cy,cz))){first=true;continue;}const p=F.W(lx,ly+cy*r,zc+cz*r*RZ);if(first){ctx.moveTo(p[0],p[1]);first=false;}else ctx.lineTo(p[0],p[1]);}
      ctx.lineWidth=1.4;ctx.strokeStyle=INK;ctx.stroke();}}};}
const custom=(F,lx,ly,layer,fn)=>({d:F.xy(lx,ly)+layer*20,draw:fn});
function render(list){list.sort((a,b)=>a.d-b.d);for(const p of list)p.draw();}

/* ---------- Koloss ---------- */
const KS=1.3;
const KC={hull:'#8a7666',track:'#3a322c',rust:'#a85a34',turret:'#8f7c6c',bone:'#d8c9a8',red:'#ff3a1a',gun:'#6b625a'};
function kPos(){return laneAt(k.s);}
function kFrame(){const [x,y]=kPos();return kframe3(x,y,0,dir,KS);}
function drawKoloss(){
  if(k.alpha<=0||(k.dead&&phaseT>.6))return;ctx.save();ctx.globalAlpha=k.alpha;
  const F=kFrame(),jig=k.v>0?Math.sin(T*28)*.8:0,L=[];
  // Schatten
  poly([F.Wg(-1.35,-.66),F.Wg(1.45,-.66),F.Wg(1.45,.66),F.Wg(-1.35,.66)],'rgba(0,0,0,.4)',0);
  // Ketten mit Laufrollen
  const tsec=[[-1.26,1],[1.2,1],[1.28,10],[1.2,19],[-1.26,19],[-1.34,10]];
  for(const side of [-1,1]){const a=side>0?.46:-.66,b=side>0?.66:-.46;L.push(prism(F,tsec,a,b,KC.track,2.4));
    const n=F.wn(0,side,0);if(visible(n)){const ly=side*.67;L.push({d:F.xy(0,ly)+.001,draw(){const u=F.fwdScreen();const rot=-k.s*3;
      for(let i=0;i<6;i++){const [x,y]=F.W(-1.05+i*.42,ly,10);ctx.save();ctx.translate(x,y);ctx.transform(u[0],u[1],0,1,0,0);const r=8.6*KS*.78;
        ctx.beginPath();ctx.arc(0,0,r,0,6.3);ctx.fillStyle='#7a7066';ctx.fill();ctx.lineWidth=2.2;ctx.strokeStyle=INK;ctx.stroke();
        ctx.beginPath();ctx.arc(0,0,r*.7,0,6.3);ctx.fillStyle='#4a433d';ctx.fill();ctx.lineWidth=1.3;ctx.stroke();
        for(let j=0;j<2;j++){const a2=rot+i+j*Math.PI/2;ctx.beginPath();ctx.moveTo(Math.cos(a2)*r*.68,Math.sin(a2)*r*.68);ctx.lineTo(-Math.cos(a2)*r*.68,-Math.sin(a2)*r*.68);ctx.lineWidth=2;ctx.stroke();}
        ctx.restore();}}});}}
  // Rumpf, schräger Bug
  L.push(prism(F,[[-1.12,14+jig],[1.0,14+jig],[.78,38+jig],[-1.12,38+jig]],-.46,.46,KC.hull,2.8));
  L.push(boxP(F,-1.14,.93,-.48,.48,19+jig,24+jig,KC.rust,1.4,0.001,true));
  // Seitengeschütze
  for(const side of [-1,1])for(const lx of [-.55,.25]){L.push(custom(F,lx,side*.62,0,()=>{const c=F.W(lx,side*.46,28+jig),m=F.W(lx-.08,side*.8,20+jig);ell(c[0],c[1],6,5,shade(KC.hull,.8),2.2);tube(c,m,3.4,'#6b625a','#9a9187');}));}
  // Räumschild und Zähne
  L.push(prism(F,[[1.14,1],[1.28,1],[1.4,20],[1.26,20]],-.62,.62,KC.rust,2.4));
  for(let i=0;i<5;i++){const ly=-.5+i*.25;L.push(custom(F,1.45,ly,0,()=>{const a=F.W(1.28,ly-.06,3),b=F.W(1.28,ly+.06,3),t=F.W(1.55,ly,1);poly([a,b,t],KC.bone,1.5);}));}
  // Turm (oben) und Aufbauten
  L.push(prism(F,[[-.62,38+jig],[.36,38+jig],[.22,58+jig],[-.62,58+jig]],-.34,.34,KC.turret,2.6,1));
  L.push(custom(F,.3,0,1.01,()=>{for(const ly of [-.14,.14]){const n=F.wn(.8,0,.6);if(!visible(n))continue;const e=F.W(.3,ly,48+jig);ell(e[0],e[1],3,2.2,KC.red,1.2);}}));
  for(const [lx,ly] of [[-.9,-.3],[-.7,.3],[.5,-.32]])L.push(custom(F,lx,ly,.9,()=>{const b=F.W(lx,ly,38+jig),t=F.W(lx+.05,ly,50+jig);poly([[b[0]-3,b[1]],[b[0]+3,b[1]],t],KC.bone,1.5);}));
  // Hauptgeschütz
  L.push(custom(F,1.0,0,1.02,()=>{const mr=k.recoil*.18,m0=F.W(.3,0,48+jig),m1=F.W(1.72-mr,0,50+jig);tube(m0,m1,8,'#4a433d','#7a746c');
    for(const t of [.62,.8]){const p=[m0[0]+(m1[0]-m0[0])*t,m0[1]+(m1[1]-m0[1])*t];ell(p[0],p[1],3.4,3.4,'#5a524a',1.6);}ell(m1[0],m1[1],4,4,C.dark,2);}));
  // Vierlingsrohre
  L.push(custom(F,0,0,2,()=>{const a0=F.W(-.28,0,58+jig),a1=F.W(-.12,0,68+jig);tube(a0,a1,6,shade(KC.hull,.6),null);
    [[-.12,-.14],[-.12,.14],[-.3,-.14],[-.3,.14]].forEach(([lx,ly],i)=>{const kick=k.aa>0&&((Math.floor(T*24)+i)%2===0)?.06:0;const a=F.W(lx,ly,60+jig),b=F.W(lx+.55-kick,ly,92-kick*40+jig);tube(a,b,3.4,'#7a746c','#a8a195');ell(b[0],b[1],2.2,2.2,C.dark,1.2);});}));
  // Antenne
  L.push(custom(F,-1.05,.25,2,()=>{const ab=F.W(-1.02,.28,38+jig),at=F.W(-1.22,.18,100+jig);ctx.beginPath();ctx.moveTo(ab[0],ab[1]);ctx.quadraticCurveTo(ab[0]+2,at[1]+20,at[0],at[1]);ctx.lineWidth=4.6;ctx.strokeStyle=INK;ctx.stroke();ctx.lineWidth=2.2;ctx.strokeStyle='#8a857a';ctx.stroke();
    ell(at[0],at[1],3.4,3.4,KC.red,1.6);if(Math.sin(T*9)>.2)for(let i=0;i<5;i++){const a=i/5*6.28+T;line(at[0]+Math.cos(a)*6,at[1]+Math.sin(a)*6,at[0]+Math.cos(a)*11,at[1]+Math.sin(a)*11,1.6,'#ffb0a0');}}));
  render(L);
  if(k.flash>0){ctx.globalAlpha=.35;const [cx,cy]=F.W(0,0,30);ell(cx,cy,70,34,'#fff3d6');ctx.globalAlpha=1;}
  ctx.restore();
  if(k.alpha>.5&&!k.dead){const [x,y]=F.W(0,0,120);const w=90;ctx.fillStyle=INK;ctx.fillRect(x-w/2-2,y-2,w+4,10);ctx.fillStyle='#3a1010';ctx.fillRect(x-w/2,y,w,6);ctx.fillStyle='#e04a2a';ctx.fillRect(x-w/2,y,w*Math.max(0,k.hp/k.max),6);
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(x-w/2+w*.7,y,1.5,6);}
}

/* ---------- Umgebung ---------- */
function drawRubble(r){const [sx,sy]=P(r.x+.5,r.y+.5);ell(sx,sy+2,22,9,'rgba(0,0,0,.22)');
  for(const p of r.pieces){const t=p.brick?['#a2684a','#834f36','#5e3826']:['#b3a58d','#8a7d6a','#5e5445'];
    const A=P(p.px,p.py,p.h),B=P(p.px+p.w,p.py,p.h),Cc=P(p.px+p.w,p.py+p.d,p.h),D=P(p.px,p.py+p.d,p.h),b1=P(p.px+p.w,p.py,0),b2=P(p.px+p.w,p.py+p.d,0),b3=P(p.px,p.py+p.d,0);
    poly([b3,b2,Cc,D],t[1],2);poly([b2,b1,B,Cc],t[2],2);poly([A,B,Cc,D],t[0],2);}}
function drawBollwerk(x,y){const hw=.46,cx=x+.5,cy=y+.5,h=26;
  const b=[P(cx-hw,cy+hw),P(cx+hw,cy+hw),P(cx+hw,cy-hw)],t=[P(cx-hw,cy-hw,h),P(cx+hw,cy-hw,h),P(cx+hw,cy+hw,h),P(cx-hw,cy+hw,h)];
  ell(...P(cx,cy),30,12,'rgba(0,0,0,.3)');
  poly([b[0],b[1],t[2],t[3]],'#6b6154',2.6);poly([b[1],b[2],t[1],t[2]],'#4a433a',2.6);poly(t,'#8a7d6a',2.6);

    else if(p.k==='dust'){ctx.globalAlpha=u*.7;ell(p.x,p.y,r,r*.7,'#9b8568',1.2,'rgba(26,20,16,.4)');}
    else if(p.k==='smoke'){ctx.globalAlpha=u*.7;ell(p.x,p.y,r,r,'#6b625a',1.2,'rgba(26,20,16,.5)');}
    else if(p.k==='fire'){const col=u>.7?'#fff3b0':u>.45?'#ffb13b':u>.2?'#e2531f':'#5a3a2e';ctx.globalAlpha=u>.2?1:u*4;ell(p.x,p.y,r,r,col);}
    else if(p.k==='spark'){ctx.globalAlpha=u;line(p.x,p.y,p.x-p.vx*.03,p.y-p.vy*.03,2,'#ffe07a');}}
  ctx.globalAlpha=1;
  // Beschriftung
  ctx.textAlign='center';ctx.font="700 13px 'Barlow Condensed',sans-serif";ctx.lineWidth=4;ctx.strokeStyle=INK;
  const lab=(t,x,y)=>{ctx.strokeText(t,x,y);ctx.fillStyle='#eadfc4';ctx.fillText(t,x,y);};
  {const [x,y]=P(...rift);lab('Warp-Riss',x,y+26);}{const [x,y]=P(...bastion);lab('Bastion',x,y+28);}
  drawBanner();
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
document.getElementById('restart').onclick=()=>reset();
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{dir=+b.dataset.dir;document.querySelectorAll('[data-dir]').forEach(x=>x.classList.toggle('on',x===b));reset();});
const bw=document.getElementById('bw');bw.onclick=()=>{bollwerk=!bollwerk;bw.classList.toggle('on',bollwerk);reset();};
document.getElementById('air').onclick=()=>startStrike();
const pb=document.getElementById('pause');pb.onclick=()=>{paused=!paused;pb.textContent=paused?'Weiter':'Pause';pb.classList.toggle('on',paused);};
})();
</script>
