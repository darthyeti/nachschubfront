<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nachschubfront: Stellungen-Rework</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@500;700&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1410;--plate:#3e372d;--gold:#e8c872;--text:#eadfc4;--muted:#b5a385;--ink:#000}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none;max-width:min(760px,70vw)}
.hud h1{font-family:'Pirata One',Georgia,serif;font-weight:400;font-size:clamp(26px,3.6vw,40px);margin:0;line-height:1;text-shadow:3px 3px 0 #000}
.hud p{margin:4px 0 0;font-size:15px;color:var(--muted);text-shadow:1px 1px 0 #000}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;background:#241a14;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px;border-radius:8px;width:max-content;max-width:calc(100% - 24px)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
button{font-family:inherit;font-weight:700;font-size:16px;color:var(--text);background:var(--plate);border:2px solid var(--ink);border-radius:5px;padding:7px 12px;min-height:44px;min-width:44px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(232,200,114,.35)}
button.on{background:var(--gold);color:#1a1410}
button.dot{border-bottom:6px solid var(--dot,#fff)}
button:disabled{opacity:.45;cursor:default}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sep{width:2px;height:28px;background:#000;margin:0 4px}
</style>
</head>
<body>
<canvas id="game" aria-label="Isometrische Fläche mit Stellungen, die sich zu einem kreisenden Gegner drehen und auf ihn feuern: neue Bunker mit drehbaren Aufsätzen, daneben die heutige Fassung"></canvas>
<div class="hud"><h1>Stellungen-Rework</h1><p id="note"></p><p id="perf"></p></div>
<div class="bar" id="bar">
  <div class="row">
    <button id="v-heute" type="button">Heute</button>
    <button id="v-neu" type="button">Neu</button>
    <span class="sep"></span>
    <button id="l-eine" type="button">Eine</button>
    <button id="l-drei" type="button">Drei</button>
    <button id="l-alle" type="button">Alle sechs</button>
    <button id="l-viele" type="button">30</button>
    <span class="sep"></span>
    <button id="m-mortar" type="button">Mörser</button>
    <button id="m-rocket" type="button">Raketenwerfer</button>
  </div>
  <div class="row" id="doctrines"></div>
  <div class="row">
    <button id="r-1" type="button">Rang 1</button>
    <button id="r-2" type="button">Rang 2</button>
    <button id="r-3" type="button">Rang 3</button>
    <button id="r-4" type="button">Rang 4</button>
    <button id="r-5" type="button">Rang 5</button>
    <span class="sep"></span>
    <button id="fire" type="button">Feuer</button>
    <button id="orbit" type="button">Ziel kreist</button>
    <button id="pause" type="button">Pause</button>
  </div>
  <div class="row">
    <button id="mode-live" type="button">Drehbar</button>
    <button id="mode-hybrid" type="button">Hybrid 16</button>
    <button id="mode-stages" type="button">Nur 16 Stufen</button>
    <button id="silhouette" type="button">Silhouette</button>
    <button id="biome" type="button">Boden: Asche</button>
    <span class="sep"></span>
    <button id="zoom-05" type="button">0,5x</button>
    <button id="zoom-1" type="button">1x</button>
    <button id="zoom-2" type="button">2x</button>
    <button id="fit" type="button">Einpassen</button>
  </div>
</div>
<script type="module" src="stellungen-rework.js"></script>
</body>
</html>
