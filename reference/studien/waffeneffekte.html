<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nachschubfront: Waffeneffekte</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@500;700&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1410;--plate:#3e372d;--gold:#e8c872;--text:#eadfc4;--muted:#b5a385;--ink:#000}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none !important}
.hud{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none;max-width:min(760px,calc(100% - 32px))}
.hud h1{font-family:'Pirata One',Georgia,serif;font-weight:400;font-size:clamp(26px,3.6vw,40px);margin:0;line-height:1;text-shadow:3px 3px 0 #000}
.hud p{margin:4px 0 0;font-size:15px;color:var(--muted);text-shadow:1px 1px 0 #000}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;background:#241a14;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px;border-radius:8px;width:max-content;max-width:calc(100% - 24px)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
button{font-family:inherit;font-weight:700;font-size:15px;color:var(--text);background:var(--plate);border:2px solid var(--ink);border-radius:5px;padding:6px 10px;min-height:44px;min-width:44px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(232,200,114,.35)}
button.on{background:var(--gold);color:#1a1410}
button.dot{border-bottom:6px solid var(--dot,#fff)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sep{width:2px;height:28px;background:#000;margin:0 4px}
label{display:flex;align-items:center;gap:6px;font-weight:700}
input[type=range]{width:140px;min-height:44px}
#clock,#speed-out{min-width:56px;font-variant-numeric:tabular-nums}
#table{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));max-width:min(900px,calc(100% - 24px));max-height:calc(100% - 260px);overflow:auto;background:#241a14ee;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:8px;padding:10px 14px;font-size:14px;user-select:text;-webkit-user-select:text}
#table h2{font-family:'Pirata One',Georgia,serif;font-weight:400;font-size:24px;margin:4px 0}
#table table{border-collapse:collapse;width:100%}
#table th,#table td{border-bottom:1px solid #3e372d;padding:4px 6px;text-align:left;vertical-align:top}
#table tr:first-child th{color:var(--gold)}
</style>
</head>
<body>
<canvas id="game" aria-label="Isometrische Fläche mit zwei Stellungen derselben Waffe: links die heutige Fassung aus dem Spiel, rechts der Vorschlag, beide feuern auf eine kleine Gruppe von Zielen"></canvas>
<div class="hud"><h1>Waffeneffekte</h1><p id="note"></p></div>
<div id="table" hidden></div>
<div class="bar" id="bar">
  <div class="row" id="weapons"></div>
  <div class="row">
    <button id="v-beide" type="button">Beide</button>
    <button id="v-heute" type="button">Heute</button>
    <button id="v-neu" type="button">Neu</button>
    <span class="sep"></span>
    <button id="pause" type="button">Pause</button>
    <button id="step" type="button">Schritt</button>
    <button id="restart" type="button">Von vorn</button>
    <label>Tempo <input id="speed" type="range" min="0.05" max="1" step="0.05" value="1"><span id="speed-out">100 %</span></label>
    <span id="clock">0 s</span>
    <span class="sep"></span>
    <button id="z-05" type="button">0,5x</button>
    <button id="z-1" type="button">1x</button>
    <button id="z-2" type="button">2x</button>
  </div>
  <div class="row">
    <button id="scale" type="button">Maßstab</button>
    <button id="reduced" type="button">Weniger Bewegung</button>
    <span class="sep"></span>
    Ton in der Schleife:
    <button id="s-aus" type="button">Aus</button>
    <button id="s-heute" type="button">Heute</button>
    <button id="s-neu" type="button">Neu</button>
    <span class="sep"></span>
    <button id="snd-heute" type="button">Start heute (launch)</button>
    <button id="snd-neu" type="button">Rakete neu</button>
    <button id="snd-schwer" type="button">Rakete schwer</button>
  </div>
</div>
<script type="module" src="waffeneffekte.js"></script>
</body>
</html>
